name: Release & Publish

on:
  push:
    tags:
      - "v*"

jobs:
  fff-assets:
    uses: ./.github/workflows/rg-fff.yml
    permissions:
      contents: write

  release:
    needs: fff-assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check release metadata
        run: node tools/checkReleaseMeta.mjs

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Publish to npm
        # A rerun after a publish that went through (the registry can take an
        # hour to show it) gets 409; that version is already released.
        run: |
          set +e
          out=$(pnpm publish --access public --no-git-checks 2>&1)
          code=$?
          echo "$out"
          if [ $code -ne 0 ] && echo "$out" | grep -qiE 'previously (staged|published) version|cannot publish over'; then
            echo "::notice::$(node -p 'require("./package.json").version') is already on npm; nothing to publish"
            exit 0
          fi
          exit $code

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
