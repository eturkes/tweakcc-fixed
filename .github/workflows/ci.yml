name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  fff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: cargo test --locked --manifest-path tools/rg-fff/Cargo.toml
        env:
          RG_FFF_STATE_DIR: ${{ runner.temp }}/fff-state
      - run: cargo build --locked --manifest-path tools/rg-fff/Cargo.toml
      - run: node tools/rg-fff/integration.mjs
      - run: node tools/rg-fff/compatibility-integration.mjs
      - run: node tools/rg-fff/semantic-integration.mjs
      - run: node tools/rg-fff/relevance-integration.mjs
      - run: node tools/rg-fff/daemon-integration.mjs
      - run: node tools/rg-fff/freshness-integration.mjs
      - run: node tools/rg-fff/viewer-integration.mjs
      - run: python3 tools/rg-fff/test_export_transcripts.py

  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.9

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint project
        run: pnpm lint

      - name: Test project
        run: pnpm run test

      - name: Check formatting
        run: pnpm prettier --check src
