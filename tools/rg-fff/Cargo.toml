[package]
name = "rg-fff"
version = "0.1.0"
edition = "2021"
description = "ripgrep-compatible front end backed by fff (fast file finder) with real-ripgrep fallback"
license = "MIT"

[[bin]]
name = "rg-fff"
path = "src/main.rs"

[dependencies]
fff-search = { version = "=0.11.0", features = ["definitions"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
